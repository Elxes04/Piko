[package]
name = "piko"
version = "1.2.0"
edition = "2021"
license = "MIT"
authors = ["Elxes04 <elxes04@example.com>"]
description = "A minimal, customizable system information tool written in Rust — inspired by Neofetch"
repository = "https://github.com/Elxes04/piko"
keywords = ["system", "information", "neofetch", "cli", "rust"]
categories = ["command-line-utilities", "system"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
whoami = "1.4"
sysinfo = "0.29"
colored = "2.1"
dirs = "6.0"
unicode-width = "0.2"
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"

# Arch Linux packaging
[package.metadata.aur]
name = "piko"
version = "1.2.0"
description = "A minimal, customizable system information tool written in Rust"
url = "https://github.com/Elxes04/piko"
license = "MIT"
depends = ["glibc"]
makedepends = ["rust", "cargo"]
source = ["https://github.com/Elxes04/piko/archive/v${pkgver}.tar.gz"]
sha256sums = ["SKIP"]

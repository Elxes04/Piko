layout = "default"

[output]
info_keys = [
    "OS",
    "Host",
    "Kernel",
    "Uptime",
    "Packages",
    "Shell",
    "Terminal",
    "CPU",
    "GPU",
    "Memory",
    "Disk",
    "Battery",
]
show_logo = true
logo_position = "left"
logo_size = "small"
logo_style = "ascii"
show_title = true
show_title_separator = true
show_color_blocks = true
color_blocks_style = "circle"

[logo]
enabled = true
distro = "android"
padding = 2
alignment = "left"

[theme]
name = "synthwave"
primary_color = "#00BCD4"
secondary_color = "#FFFFFF"
accent_color = "#FFC107"
text_color = "#FFFFFF"

[display]
border = false
border_style = "single"
border_color = "#00BCD4"
padding = 1
margin = 0
alignment = "left"
compact = true
show_separators = true
separator_symbol = ":"

[colors]
OS = "#FF5722"
Host = "#FF9800"
Kernel = "#607D8B"
Uptime = "#FFC107"
Packages = "#4CAF50"
Shell = "#00BCD4"
Terminal = "#00BCD4"
CPU = "#00BCD4"
GPU = "#E91E63"
Memory = "#9C27B0"
Disk = "#F44336"
Battery = "#4CAF50"

[symbols]
OS = ""
Host = "󰌢"
Kernel = ""
Uptime = "󰅐"
Packages = "󰏖"
Shell = ""
DE = "󰧨"
WM = ""
Terminal = ""
CPU = ""
GPU = "󰢮"
Memory = "󰍛"
Disk = "󰋊"
Battery = "󰁹"


layout = "compact"

[output]
info_keys = [
    "OS",
    "Host",
    "Kernel",
    "Uptime",
    "Packages",
    "Shell",
    "Memory",
]

show_logo = true
logo_position = "left"
logo_size = "small"
logo_style = "ascii"
show_title = true
show_title_separator = true
show_color_blocks = true
color_blocks_style = "circle"

[logo]
enabled = true
distro = "auto"
padding = 1
alignment = "left"

[theme]
name = "dracula"
primary_color = "#FF79C6"
secondary_color = "#50FA7B"
accent_color = "#BD93F9"

[display]
border = false
compact = true
show_separators = true
separator_symbol = ":"
padding = 0

[colors]
OS = "#FF79C6"
Host = "#50FA7B"
Kernel = "#BD93F9"
Uptime = "#FFB86C"
Packages = "#F1FA8C"
Shell = "#8BE9FD"
Memory = "#50FA7B"

[symbols]
OS = ""
Host = "󰌢"
Kernel = ""
Uptime = "󰅐"
Packages = "󰏖"
Shell = ""
Memory = "󰍛"


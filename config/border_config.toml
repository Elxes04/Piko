layout = "bordered"

[output]
info_keys = [
    "OS",
    "Host",
    "Kernel",
    "Uptime",
    "Packages",
    "Shell",
    "DE",
    "WM",
    "Terminal",
    "CPU",
    "GPU",
    "Memory",
    "Disk",
    "Battery",
]

show_logo = true
logo_position = "left"
logo_size = "medium"
logo_style = "ascii"
show_title = true
show_title_separator = true
show_color_blocks = true
color_blocks_style = "block"

[logo]
enabled = true
distro = "auto"
padding = 3
alignment = "left"

[theme]
name = "nord"
primary_color = "#88C0D0"
secondary_color = "#81A1C1"
accent_color = "#A3BE8C"

[display]
border = true
border_style = "double"
border_color = "#88C0D0"
padding = 2
margin = 1
compact = false
show_separators = true
separator_symbol = ":"

[colors]
OS = "#88C0D0"
Host = "#81A1C1"
Kernel = "#BF616A"
Uptime = "#EBCB8B"
Packages = "#A3BE8C"
Shell = "#B48EAD"
DE = "#8FBCBB"
WM = "#88C0D0"
Terminal = "#81A1C1"
CPU = "#88C0D0"
GPU = "#81A1C1"
Memory = "#A3BE8C"
Disk = "#D08770"
Battery = "#A3BE8C"

[symbols]
OS = ""
Host = "󰌢"
Kernel = ""
Uptime = "󰅐"
Packages = "󰏖"
Shell = ""
DE = "󰧨"
WM = ""
Terminal = ""
CPU = ""
GPU = "󰢮"
Memory = "󰍛"
Disk = "󰋊"
Battery = "󰁹"


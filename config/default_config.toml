# Piko Configuration File
layout = "default"

[output]
# List of information items to display in order:
# Options: "OS", "Host", "Kernel", "Uptime", "Packages", "Shell",
#          "DE", "WM", "Terminal", "CPU", "GPU", "Memory", "Disk", "Battery"
info_keys = [
    "OS",
    "Host",
    "Kernel",
    "Uptime",
    "Packages",
    "Shell",
    "DE",
    "WM",
    "Terminal",
    "CPU",
    "GPU",
    "Memory",
    "Disk",
    "Battery",
]

# Logo configuration
show_logo = true
logo_position = "left"    # "left", "right", "top", "bottom"
logo_size = "medium"       # "small", "medium", "large"
logo_style = "ascii"       # "ascii", "unicode", "minimal"

# Header & palette blocks
show_title = true          # Display user@hostname
show_title_separator = true # Underline delimiter
show_color_blocks = true   # Display color palette blocks at bottom
color_blocks_style = "circle" # "circle" (●) or "block" (█)

[logo]
enabled = true
distro = "auto"            # "auto" or specific distro name
padding = 2
alignment = "left"

[theme]
# Built-in themes: "default", "dracula", "catppuccin", "catppuccin-latte",
#                  "nord", "gruvbox", "tokyo-night", "one-dark", "solarized",
#                  "rose-pine", "synthwave"
name = "catppuccin"
primary_color = "#CBA6F7"
secondary_color = "#89B4FA"
accent_color = "#A6E3A1"
text_color = "#CDD6F4"

[display]
border = false
border_style = "rounded"   # "single", "double", "rounded", "bold", "none"
border_color = "#6C7086"
padding = 1
margin = 0
alignment = "left"
compact = false
show_separators = true
separator_symbol = ":"

[colors]
# Specific color overrides per information key
OS = "#CBA6F7"
Host = "#89B4FA"
Kernel = "#F38BA8"
Uptime = "#FAB387"
Packages = "#F9E2AF"
Shell = "#A6E3A1"
DE = "#94E2D5"
WM = "#89DCEB"
Terminal = "#74C7EC"
CPU = "#89B4FA"
GPU = "#B4BEFE"
Memory = "#A6E3A1"
Disk = "#F38BA8"
Battery = "#A6E3A1"

[symbols]
# Icons / symbols prefixing each field
OS = ""
Host = "󰌢"
Kernel = ""
Uptime = "󰅐"
Packages = "󰏖"
Shell = ""
DE = "󰧨"
WM = ""
Terminal = ""
CPU = ""
GPU = "󰢮"
Memory = "󰍛"
Disk = "󰋊"
Battery = "󰁹"


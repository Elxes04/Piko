layout = "default"

[output]
info_keys = [
    "OS",
    "Host",
    "Kernel",
    "Uptime",
    "Packages",
    "Shell",
    "DE",
    "WM",
    "Terminal",
    "CPU",
    "GPU",
    "Memory",
    "Disk",
    "Battery",
]

show_logo = true
logo_position = "left"
logo_size = "medium"
logo_style = "ascii"
show_title = true
show_title_separator = true
show_color_blocks = true
color_blocks_style = "circle"

[logo]
enabled = true
distro = "auto"
padding = 2
alignment = "left"

[theme]
name = "catppuccin-latte"
primary_color = "#8839EF"
secondary_color = "#1E66F5"
accent_color = "#40A02B"
text_color = "#4C4F69"

[display]
border = false
border_style = "rounded"
border_color = "#9CA0B0"
padding = 1
margin = 0
compact = false
show_separators = true
separator_symbol = ":"

[colors]
OS = "#FFB3BA"
Host = "#1E66F5"
Kernel = "#D4D4D4"
Uptime = "#FFE6B3"
Packages = "#40A02B"
Shell = "#179299"
DE = "#8839EF"
WM = "#1E66F5"
Terminal = "#40A02B"
CPU = "#B8E6B8"
GPU = "#FFD4B3"
Memory = "#BAE1FF"
Disk = "#FFB3D9"
Battery = "#BAFFC9"

[symbols]
OS = ""
Host = "󰌢"
Kernel = ""
Uptime = "󰅐"
Packages = "󰏖"
Shell = ""
DE = "󰧨"
WM = ""
Terminal = ""
CPU = ""
GPU = "󰢮"
Memory = "󰍛"
Disk = "󰋊"
Battery = "󰁹"


layout = "default"

[output]
info_keys = [
    "OS",
    "Host",
    "Kernel",
    "Uptime",
    "Packages",
    "Shell",
    "DE",
    "WM",
    "Terminal",
    "CPU",
    "GPU",
    "Memory",
    "Disk",
    "Battery",
]

show_logo = true
logo_position = "left"
logo_size = "medium"
logo_style = "ascii"
show_title = true
show_title_separator = true
show_color_blocks = true
color_blocks_style = "circle"

[logo]
enabled = true
distro = "auto"
padding = 2
alignment = "left"

[theme]
name = "one-dark"
primary_color = "#61AFEF"
secondary_color = "#98C379"
accent_color = "#E5C07B"
text_color = "#ABB2BF"

[display]
border = false
border_style = "rounded"
border_color = "#5C6370"
padding = 1
margin = 0
compact = false
show_separators = true
separator_symbol = ":"

[colors]
OS = "#E06C75"
Host = "#61AFEF"
Kernel = "#ABB2BF"
Uptime = "#F8BBD9"
Packages = "#98C379"
Shell = "#56B6C2"
DE = "#C678DD"
WM = "#61AFEF"
Terminal = "#98C379"
CPU = "#61AFEF"
GPU = "#FFA07A"
Memory = "#56B6C2"
Disk = "#FF6B6B"
Battery = "#98C379"

[symbols]
OS = ""
Host = "󰌢"
Kernel = ""
Uptime = "󰅐"
Packages = "󰏖"
Shell = ""
DE = "󰧨"
WM = ""
Terminal = ""
CPU = ""
GPU = "󰢮"
Memory = "󰍛"
Disk = "󰋊"
Battery = "󰁹"

